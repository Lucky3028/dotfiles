[[mount.entry]]
src = "home/.config"
dst = "~/.config"

[[mount.entry]]
src = "home/.ssh"
dst = "~/.ssh"

[[mount.entry]]
src = "home/.githooks"
dst = "~/.githooks"

[[mount.entry]]
src = "home/bin"
dst = "~/bin"

[[mount.entry]]
src = "home/.codex"
dst = "~/.codex"
strategy = "per-file"

[absorb]
auto = true
require_clean_git = true
on_anomaly = "ask"

[ui]
auto_update = "notify"
