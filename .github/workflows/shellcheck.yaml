name: Format shell files
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions: {}
jobs:
  shfmt:
    name: Run shfmt
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: reviewdog/action-shfmt@f0e83599fd97829d6c8e67e3f97ce97d6d89ec68 # v1.2.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fail_level: warning
          shfmt_flags: -i 2
