name: yui check
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  yui:
    name: Validate yui configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install yui
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          # renovate: datasource=crate depName=yui-cli
          tool: yui-cli@0.10.0
          fallback: cargo-binstall
      - name: List managed files
        run: yui list --no-color
