model = "gpt-6-luna"
model_reasoning_effort = "max"
plan_mode_reasoning_effort = "max"

check_for_update_on_startup = false
approval_policy = "on-request"
approvals_reviewer = "auto_review"
default_permissions = "safe-workspace"
web_search = "cached"

[permissions.safe-workspace]
description = "Workspace editing with VCS metadata access and sensitive files protected"
extends = ":workspace"

[permissions.safe-workspace.filesystem]
glob_scan_max_depth = 3
# These SSH metadata files are readable so yui-managed links can be verified.
"~/.ssh/config" = "read"
"~/.ssh/allowed_signers" = "read"
# Allow npm to use its package cache for CLI-based validation commands.
"~/.npm/**" = "write"
# Allow Go to use its build cache.
"~/.cache/go-build/**" = "write"
# Allow Go to use its module download cache.
"~/go/pkg/**" = "write"
# Allow mise to use its tool-path cache.
"~/.cache/mise/**" = "write"
# Allow Cargo to use its package and git caches.
"~/.cargo/registry/**" = "write"
"~/.cargo/git/**" = "write"
# Allow pnpm to use its cache and package store.
"~/.cache/pnpm/**" = "write"
"~/.local/share/pnpm/**" = "write"
# Allow gradle to use its build cache.
"~/.gradle/**" = "write"
# Allow gh to use its cache.
"~/.cache/gh/**" = "write"

[permissions.safe-workspace.filesystem.":workspace_roots"]
".git/**" = "write"
"**/*.sock" = "deny"
"**/.kube/**" = "deny"
# Keep common SSH private-key names protected while allowing non-secret SSH metadata.
"**/.ssh/id_*" = "deny"
"**/.ssh/*_key" = "deny"
"**/.ssh/*.pem" = "deny"
"**/.ssh/*.key" = "deny"
# Deny common secret-bearing environment files.
"**/.npmrc" = "deny"
"**/.env" = "deny"
"**/.env.local" = "deny"
"**/.env.dev" = "deny"
"**/.env.development" = "deny"
"**/.env.development.local" = "deny"
"**/.env.test" = "deny"
"**/.env.test.local" = "deny"
"**/.env.staging" = "deny"
"**/.env.staging.local" = "deny"
"**/.env.prd" = "deny"
"**/.env.prod" = "deny"
"**/.env.production" = "deny"
"**/.env.production.local" = "deny"
"**/.env.secret" = "deny"
"**/*.env" = "deny"
"**/*.env.local" = "deny"
"**/*.env.dev" = "deny"
"**/*.env.development" = "deny"
"**/*.env.test" = "deny"
"**/*.env.staging" = "deny"
"**/*.env.prd" = "deny"
"**/*.env.prod" = "deny"
"**/*.env.production" = "deny"
"**/.envrc*" = "deny"
"**/.dev.vars" = "deny"
"**/.dev.vars.local" = "deny"
"**/.dev.vars.dev" = "deny"
"**/.dev.vars.development" = "deny"
"**/.dev.vars.test" = "deny"
"**/.dev.vars.staging" = "deny"
"**/.dev.vars.prd" = "deny"
"**/.dev.vars.prod" = "deny"
"**/.dev.vars.production" = "deny"

[permissions.safe-workspace.network]
enabled = true

[permissions.safe-workspace.network.domains]
"*" = "allow"

[tui.model_availability_nux]
gpt-6-astra = 1

[projects."/home/lucky/ghq/github.com/GiganticMinecraft/EatEgg"]
trust_level = "trusted"
